<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offlined Sea 3D Models</title>
<meta name="description" content="Open 3D models of shipwrecks, sunken aircraft and underwater places that have a Wikipedia article, by Wikidata id.">
<style>
  :root { --bg: #06121c; --panel: #0c1d2b; --line: #1d3447; --text: #e6eef4; --muted: #8fa6b8; --acc: #3fb6d8; --gold: #e0b44a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  #card .tog { float: right; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 0 0 8px; }
  #card.min > :not(h2) { display: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  a { color: var(--acc); }
  #app { display: grid; grid-template-columns: 360px 1fr; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header .sub { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header nav { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  header button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .filters { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters input[type=search], .filters select { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: #071622; color: var(--text); font: inherit; }
  .filters .row { display: flex; gap: 8px; }
  .filters label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  #count { color: var(--muted); font-size: 12px; }
  #list { overflow: auto; flex: 1; }
  .it { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #10263a; cursor: pointer; }
  .it:hover { background: #10283b; }
  .it.on { background: #15405a; }
  .it .ic { font-size: 17px; text-align: center; }
  .it .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .nm small { display: block; color: var(--muted); font-size: 12px; }
  .it .dp { color: var(--muted); font-size: 12px; text-align: right; }
  .it .own { color: var(--gold); font-size: 11px; font-weight: 700; }
  #more { margin: 10px 12px; padding: 7px; width: calc(100% - 24px); border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--text); cursor: pointer; }
  main { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #card { position: absolute; left: 16px; top: 16px; width: 340px; max-width: calc(100% - 32px); background: rgba(10,26,38,0.92); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #card h2 { margin: 0 0 2px; font-size: 18px; }
  #card .fam { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; font-size: 13px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; }
  #card .links { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
  #card .model { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #0a2232; font-size: 13px; }
  #card .model.own { border-left: 3px solid var(--gold); }
  #card .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #card .btns button { border: 1px solid var(--line); background: #0f2a3c; color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  #card .btns button.on { background: var(--acc); color: #04121d; border-color: var(--acc); }
  #scale { position: absolute; right: 16px; bottom: 14px; color: var(--muted); font-size: 12px; text-align: right; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 42% 1fr; }
    header { grid-column: 1; }
    header .sub { display: none; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    #card { width: auto; right: 16px; font-size: 13px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>🌊 Offlined Sea 3D Models</h1>
    <div class="sub" id="sub"></div>
    <nav>
      <a href="https://github.com/Aruvaro-Chulvi/OfflinedSea3DModels" id="lnk-repo">GitHub</a>
      <a href="https://github.com/Aruvaro-Chulvi/OfflinedSea3DModels/blob/main/CONTRIBUTING.md" id="lnk-contrib"></a>
      <button id="lang" type="button"></button>
    </nav>
  </header>
  <aside>
    <div class="filters">
      <input type="search" id="q" autocomplete="off">
      <div class="row">
        <select id="fam"></select>
        <select id="wl"></select>
      </div>
      <div class="row" style="justify-content: space-between">
        <label><input type="checkbox" id="own"> <span id="own-l"></span></label>
        <span id="count"></span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div id="empty"></div>
    <div id="card" hidden></div>
    <div id="scale"></div>
  </main>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
