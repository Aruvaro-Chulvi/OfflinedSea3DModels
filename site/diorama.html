<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama · Offlined Sea 3D Models</title>
<meta name="description" content="A wreck on its own piece of seabed, with the life around it, to look at closely.">
<style>
  html, body { margin: 0; height: 100%; background: #01060b; }
  #app { position: fixed; inset: 0; }
  #back { position: fixed; left: 16px; bottom: 56px; z-index: 5; color: #8fd3ea; font: 13px system-ui, sans-serif; text-decoration: none;
          background: rgba(8,22,33,.85); border: 1px solid #2a4458; border-radius: 8px; padding: 6px 11px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<a id="back" href="./">←</a>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { openDiorama } from "./diorama-viewer.js";

const q = (location.hash.slice(1) || new URLSearchParams(location.search).get("q") || "Q25173").replace(/[^A-Za-z0-9]/g, "");
let lang = "en";
try { lang = localStorage.getItem("s3d_lang") || (/^es\b/i.test(navigator.language) ? "es" : "en"); } catch { /* */ }
const idx = await fetch("models/index.json").then(r => r.json()).catch(() => ({ item: {} }));
const m = (idx.item || {})[q] || {};
document.title = `${m.name || q} · Diorama`;
const back = document.getElementById("back");
back.href = "./#" + q; back.textContent = lang === "es" ? "← Volver al catálogo" : "← Back to the catalog";
const au = (m.authors || []).map(a => a.name).join(", ");
window.__dio = await openDiorama(document.getElementById("app"), {
  THREE, OrbitControls, lang, title: m.name || q,
  credits: au ? `${au} · ${m.license || ""}` : "",
  url: `models/item/${q}/diorama.glb`,
  load: url => new GLTFLoader().loadAsync(url).then(g => g.scene),
});
</script>
</body>
</html>
